:root{--bg1:#24104f;--bg2:#46207f;--ink:#241a3d;--mut:#6c6487;--card:#fff;--line:#e4def3;--orange:#ff7a45;--orangeD:#d8531f;--blue:#3d9bff;--blueD:#1f6fd1;--green:#2fbf71;--greenD:#1d8f51;--pink:#ff4f9a;--pinkD:#cc2f73;--gold:#ffc93c;--goldD:#d79a0d;--teal:#19c2b4;--tealD:#0f8f84;--red:#e8402a;--purple:#7b4dff;--purpleD:#5530c9;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{font-family:'Andika',system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 0%,#5a2a9e 0,transparent 45%),radial-gradient(circle at 90% 30%,#1b6f8a 0,transparent 40%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;min-height:100vh;font-size:17px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.wrap{max-width:780px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3,.f{font-family:'Fredoka',system-ui,sans-serif;font-weight:700;letter-spacing:.2px}
h2{font-size:22px;margin:4px 0 10px}h3{font-size:18px;margin:14px 0 8px}
.top{display:flex;align-items:center;gap:10px;color:#fff;margin:4px 0 12px}

function gStats(){const p=G.p,B=G.B,m=1+0.1*p.cubes;const old=p.max||0;p.max=Math.round(B.hp*m);p.dmgM=m;if(old&&p.hp!=null)p.hp=Math.min(p.max,p.hp+(p.max-old));}
function gSpawnBot(type,x,y,respawn){const T=BOTS[type];G.bots.push({type,x,y,r:T.r,hp:T.hp,max:T.hp,cd:1+Math.random(),face:Math.PI/2,wp:null,wpT:0,slowT:0,frzT:0,hurtT:0,seed:Math.random()*10,respawn,home:{x,y}});}
function gBanner(s){G.banner={s,t:2.2};}

// ---------- Schleife ----------
function gLoop(now){if(!G.on)return;G.raf=requestAnimationFrame(gLoop);let dt=(now-G.last)/1000;G.last=now;if(dt>0.05)dt=0.05;if(dt<0)dt=0;
 if(!G.paused&&!G.ended){gUpdate(dt);G.secAcc+=dt;if(G.secAcc>=1){G.secAcc-=1;S.g.sec++;}}
 gRender();}
function gDist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function gCollide(e){const A=G.A;e.x=Math.max(e.r,Math.min(A.w-e.r,e.x));e.y=Math.max(e.r,Math.min(A.h-e.r,e.y));
 for(const w of A.walls){const cx=Math.max(w.x,Math.min(e.x,w.x+w.w)),cy=Math.max(w.y,Math.min(e.y,w.y+w.h));const dx=e.x-cx,dy=e.y-cy,d=Math.hypot(dx,dy);
  if(d<e.r){if(d>0.001){e.x=cx+dx/d*e.r;e.y=cy+dy/d*e.r;}else{const l=e.x-w.x,r=w.x+w.w-e.x,t=e.y-w.y,b=w.y+w.h-e.y,m=Math.min(l,r,t,b);if(m===l)e.x=w.x-e.r;else if(m===r)e.x=w.x+w.w+e.r;else if(m===t)e.y=w.y-e.r;else e.y=w.y+w.h+e.r;}}}}
function gInWall(x,y,pad){for(const w of G.A.walls){if(x>w.x-pad&&x<w.x+w.w+pad&&y>w.y-pad&&y<w.y+w.h+pad)return w;}return null;}
function gRandPt(){const A=G.A;for(let i=0;i<20;i++){const x=80+Math.random()*(A.w-160),y=80+Math.random()*(A.h-160);if(!gInWall(x,y,40))return{x,y};}return{x:A.w/2,y:A.h/2};}
function gEnemies(){const L=G.bots.filter(b=>b.hp>0);if(G.boss&&G.boss.hp>0)L.push(G.boss);if(G.safe&&G.safe.hp>0)L.push(G.safe);return L;}

function gUpdate(dt){const p=G.p,A=G.A,B=G.B;G.t+=dt;if(G.shake>0)G.shake=Math.max(0,G.shake-dt*30);if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
 // Spieler
 if(p.dead){p.respT-=dt;if(p.respT<=0){if(p.lives<=0){gEnd(false);return;}p.dead=false;p.x=A.spawn.x;p.y=A.spawn.y;p.hp=p.max;p.inv=1.5;p.ammo=3;}}
 else{let mx=0,my=0;const k=IN.keys;if(k.ArrowLeft||k.a||k.A)mx-=1;if(k.ArrowRight||k.d||k.D)mx+=1;if(k.ArrowUp||k.w||k.W)my-=1;if(k.ArrowDown||k.s||k.S)my+=1;
  if(IN.joy){mx=IN.jx;my=IN.jy;}const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}
  if(ml>0.1)p.face=Math.atan2(my,mx);const sp=B.speed*(p.slowT>0?0.6:1);p.x+=mx*sp*dt;p.y+=my*sp*dt;gCollide(p);
  p.slowT=Math.max(0,p.slowT-dt);p.inv=Math.max(0,p.inv-dt);p.hurtT=Math.max(0,p.hurtT-dt);p.cd=Math.max(0,p.cd-dt);
  if(p.ammo<3){p.rl+=dt/B.reload;if(p.rl>=1){p.rl=0;p.ammo++;}}
  if(G.t-p.lastDmg>3&&p.hp<p.max)p.hp=Math.min(p.max,p.hp+p.max*0.13*dt);
  p.inBush=G.A.bushes.some(b=>Math.hypot(p.x-b.x,p.y-b.y)<b.r);
  if(k[' ']||k.j||k.J){gFire(null);}
 }
 // Bots
 for(const b of G.bots){if(b.hp<=0)continue;gBot(b,dt);}
 for(let i=0;i<G.bots.length;i++)for(let j=i+1;j<G.bots.length;j++){const a=G.bots[i],c=G.bots[j];if(a.hp<=0||c.hp<=0||BOTS[a.type].fixed||BOTS[c.type].fixed)continue;const d=gDist(a,c),m=a.r+c.r;if(d<m&&d>0.01){const f=(m-d)/2;a.x-=(c.x-a.x)/d*f;a.y-=(c.y-a.y)/d*f;c.x+=(c.x-a.x)/d*f;c.y+=(c.y-a.y)/d*f;}}
 // Respawn-Warteschlange
 for(const r of G.resp){r.t-=dt;}const ready=G.resp.filter(r=>r.t<=0);G.resp=G.resp.filter(r=>r.t>0);
 ready.forEach(r=>{const sp=A.botSpawn?A.botSpawn[Math.floor(Math.random()*A.botSpawn.length)]:r.home;gSpawnBot(r.type,sp.x,sp.y,true);});
 if(G.boss)gBossUpd(dt);
 if(G.safe){G.safe.dial+=dt*2;G.safe.hurtT=Math.max(0,G.safe.hurtT-dt);}
 // Zonen (Platzregen)
 for(const z of G.zones){z.t-=dt;if(z.follow){z.x=p.x;z.y=p.y;}for(const e of gEnemies()){if(Math.hypot(e.x-z.x,e.y-z.y)<z.r+e.r*0.5)gHurt(e,z.dps*dt*G.p.dmgM,null,true);}}
 G.zones=G.zones.filter(z=>z.t>0);
 // Geschosse
 for(const b of G.bul){const st=Math.hypot(b.vx,b.vy)*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.d+=st;b.rot=(b.rot||0)+dt*8;
  if(b.d>b.range){b.dead=true;gPuff(b.x,b.y,b.col,4);continue;}
  const w=gInWall(b.x,b.y,b.r*0.5);if(w){b.dead=true;gPuff(b.x,b.y,b.col,5);if(w.crate&&b.own==='p'){w.hp-=b.dmg;w.hurtT=0.1;if(w.hp<=0)gCrate(w);}continue;}
  if(b.own==='p'){for(const e of gEnemies()){if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){b.dead=true;const hit=gHurt(e,b.dmg,b);if(hit&&!b.sup){p.sup=Math.min(1,p.sup+B.superPerHit);}gPuff(b.x,b.y,b.col,6);break;}}}
  else if(!p.dead&&Math.hypot(p.x-b.x,p.y-b.y)<p.r+b.r){b.dead=true;gHurtP(b.dmg);gPuff(b.x,b.y,b.col,6);}
 }
 G.bul=G.bul.filter(b=>!b.dead);
 // Aufsammeln
 for(const k of G.pick){k.t+=dt;if(k.vx||k.vy){k.x+=k.vx*dt;k.y+=k.vy*dt;k.vx*=Math.pow(0.04,dt);k.vy*=Math.pow(0.04,dt);if(Math.abs(k.vx)+Math.abs(k.vy)<4){k.vx=k.vy=0;}const ww=gInWall(k.x,k.y,6);if(ww){k.vx=k.vy=0;k.x=Math.max(ww.x-14,Math.min(k.x,ww.x+ww.w+14));}}
  if(!p.dead&&k.t>0.35&&Math.hypot(p.x-k.x,p.y-k.y)<p.r+20){k.dead=true;gPickup(k);}}
 G.pick=G.pick.filter(k=>!k.dead);
 // Effekte
 for(const f of G.fx){f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=0.92;f.vy*=0.92;}G.fx=G.fx.filter(f=>f.t<f.life);
 for(const t of G.txt){t.t+=dt;t.y-=40*dt;}G.txt=G.txt.filter(t=>t.t<0.9);
 // Modus
 if(G.mode==='a1'){G.gemT-=dt;const n=G.pick.filter(k=>k.kind==='gem'||k.kind==='gold').length;if(G.gemT<=0&&n<6){G.gemT=2.1;G.gemN++;const a=Math.random()*TAU,s=150+Math.random()*120;G.pick.push({kind:G.gemN%3===0?'gold':'gem',x:G.mine.x,y:G.mine.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0});sfx('pop');}
  if(p.gems>=10&&!G.paused)gEnd(true);}
 if(G.mode==='a2'&&!G.paused&&G.bots.every(b=>b.hp<=0))gEnd(true);
 if(G.mode==='a3'&&G.safe){const r=G.safe.hp/G.safe.max;if(G.marks.length&&r<=G.marks[0]&&G.safe.hp>0&&!G.paused){G.marks.shift();gClueAsk('c3','Tresor-Hinweis',ok=>{if(ok){gHurt(G.safe,150,null,true);gBolt(G.safe.x,G.safe.y);p.sup=1;gBanner('⚡ Blitzschlag! −150');}});}
  if(G.safe.hp<=0&&!G.paused)gEnd(true);}
 if(G.mode==='boss'&&!G.paused&&G.boss&&G.boss.hp<=0)gEnd(true);
 if(G.limit&&G.t>=G.limit&&!G.ended&&!G.paused)gEnd(false,'time');
 // HUD
 G.hudT-=dt;if(G.hudT<=0){G.hudT=0.1;gHud();}}

function gBot(b,dt){const T=BOTS[b.type],p=G.p;b.hurtT=Math.max(0,b.hurtT-dt);if(b.frzT>0){b.frzT-=dt;return;}const sm=b.slowT>0?0.5:1;b.slowT=Math.max(0,b.slowT-dt);b.cd-=dt;
 const dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy)||1;const sees=!p.dead&&d<540&&(!p.inBush||d<130);
 if(T.fixed){if(sees){b.face=Math.atan2(dy,dx);if(d<T.range&&b.cd<=0){gShootE(b,b.face+(Math.random()-.5)*0.15,T);b.cd=T.cool;}}return;}
 let mx=0,my=0;
 if(sees){b.face=Math.atan2(dy,dx);
  if(T.melee){mx=dx/d;my=dy/d;if(d<b.r+p.r+8&&b.cd<=0){gHurtP(T.dmg);b.cd=T.cool;b.x-=dx/d*20;b.y-=dy/d*20;}}
  else{const want=T.range*0.65;if(d>want+40){mx=dx/d;my=dy/d;}else if(d<want-60){mx=-dx/d;my=-dy/d;}const s=Math.sin(G.t*1.3+b.seed)*0.8;mx+=-dy/d*s;my+=dx/d*s;
   if(d<T.range&&b.cd<=0){gShootE(b,Math.atan2(dy,dx)+(Math.random()-.5)*0.24,T);b.cd=T.cool*(0.85+Math.random()*0.3);}}}
 else{if(!b.wp||b.wpT<=0||gDist(b,b.wp)<30){b.wp=gRandPt();b.wpT=4;}b.wpT-=dt;const wx=b.wp.x-b.x,wy=b.wp.y-b.y,wd=Math.hypot(wx,wy)||1;mx=wx/wd*0.6;my=wy/wd*0.6;b.face=Math.atan2(wy,wx);}
 const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml;}b.x+=mx*T.speed*sm*dt;b.y+=my*T.speed*sm*dt;gCollide(b);}
function gShootE(b,ang,T){G.bul.push({x:b.x+Math.cos(ang)*b.r,y:b.y+Math.sin(ang)*b.r,vx:Math.cos(ang)*T.bspd,vy:Math.sin(ang)*T.bspd,r:9,dmg:T.dmg,own:'e',d:0,range:T.range+80,col:T.kind==='bolt'?'#ffd23c':'#d9f3ff',kind:T.kind});}

function gBossUpd(dt){const b=G.boss,p=G.p;b.hurtT=Math.max(0,b.hurtT-dt);b.touchCd=Math.max(0,b.touchCd-dt);if(b.hp<=0)return;
 const r=b.hp/b.max;b.phase=r>0.66?1:(r>0.33?2:3);
 if(b.shield){b.retry-=dt;if(b.retry<=0&&!G.paused){b.retry=99;gBossQuiz();}}
 if(b.marks.length&&r<=b.marks[0]&&!b.shield){b.hp=Math.max(b.hp,b.max*b.marks[0]);b.marks.shift();b.shield=true;gBanner('🛡️ Klima-Schild!');b.retry=0.4;}
 if(b.frzT>0){b.frzT-=dt;return;}
 const dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy)||1;b.face=Math.atan2(dy,dx);
 if(b.tele>0){b.tele-=dt;if(b.tele<=0){b.dash=0.55;}return;}
 if(b.dash>0){b.dash-=dt;b.x+=Math.cos(b.dang)*560*dt;b.y+=Math.sin(b.dang)*560*dt;gCollide(b);if(!p.dead&&d<b.r+p.r&&b.touchCd<=0){gHurtP(24);b.touchCd=0.8;}return;}
 const sp=(b.slowT>0?0.5:1)*(b.phase===3?85:65);b.slowT=Math.max(0,b.slowT-dt);
 if(!p.dead){if(d>240){b.x+=dx/d*sp*dt;b.y+=dy/d*sp*dt;}else if(d<160){b.x-=dx/d*sp*dt;b.y-=dy/d*sp*dt;}gCollide(b);if(d<b.r+p.r&&b.touchCd<=0){gHurtP(14);b.touchCd=0.8;}}
 b.cdR-=dt;b.cdA-=dt;b.cdS-=dt;b.cdD-=dt;
 if(b.cdR<=0){const n=b.phase===3?18:14,off=Math.random()*TAU;for(let i=0;i<n;i++){const a=off+i*TAU/n;G.bul.push({x:b.x,y:b.y,vx:Math.cos(a)*215,vy:Math.sin(a)*215,r:10,dmg:11,own:'e',d:0,range:720,col:'#dff6ff',kind:'snow'});}b.cdR=b.phase===3?2.0:2.4;sfx('boss');}
 if(b.phase>=2&&b.cdA<=0&&!p.dead){for(let i=-1;i<=1;i++){const a=b.face+i*0.24;G.bul.push({x:b.x,y:b.y,vx:Math.cos(a)*330,vy:Math.sin(a)*330,r:11,dmg:14,own:'e',d:0,range:640,col:'#ff8a2a',kind:'fire'});}b.cdA=b.phase===3?1.5:1.7;}
 if(b.phase>=2&&b.cdS<=0){const alive=G.bots.filter(x=>x.hp>0).length;if(alive<4){for(let i=0;i<2;i++){const a=Math.random()*TAU;gSpawnBot('storm',b.x+Math.cos(a)*110,b.y+Math.sin(a)*110,false);}gBanner('Sturmwolken!');}b.cdS=8;}
 if(b.phase===3&&b.cdD<=0&&!p.dead){b.tele=0.75;b.dang=b.face;b.cdD=6.5;}}
function gBossQuiz(){const b=G.boss;gClueAsk('boss','Boss-Rätsel: Brich den Schild!',ok=>{if(ok){b.shield=false;b.frzT=1.5;G.p.sup=1;gBanner('Schild zerbrochen! 💥');for(let i=0;i<30;i++)gPart(b.x,b.y,'#bff3ff',260);}else{b.retry=5;gBanner('Schild hält noch 5 Sekunden …');}});}

// ---------- Kampf ----------
function gAuto(range){const p=G.p;let best=null,bd=1e9;for(const e of gEnemies()){const d=gDist(p,e)-(e.r||0);if(d<range*1.05&&d<bd){bd=d;best=e;}}
 if(!best){for(const w of G.A.walls){if(!w.crate)continue;const c={x:w.x+w.w/2,y:w.y+w.h/2};const d=gDist(p,c);if(d<range&&d<bd){bd=d;best=c;}}}
 return best?Math.atan2(best.y-p.y,best.x-p.x):null;}
function gFire(ang){const p=G.p,B=G.B,a=B.atk;if(p.dead||p.cd>0)return;if(p.ammo<1){return;}
 let an=ang;if(an==null)an=gAuto(a.range);if(an==null)an=p.face;p.face=an;p.ammo--;p.cd=0.32;
 const mk=(aa)=>G.bul.push({x:p.x+Math.cos(aa)*p.r,y:p.y+Math.sin(aa)*p.r,vx:Math.cos(aa)*a.spd,vy:Math.sin(aa)*a.spd,r:a.r,dmg:a.dmg*p.dmgM,own:'p',d:0,range:a.range,col:a.col,kind:S.g.sel,slow:a.slow||0});
 if(a.kind==='spread'){for(let i=0;i<a.n;i++)mk(an+(i-(a.n-1)/2)*a.spread/(a.n-1)*2);}else mk(an);sfx('shot');}
function gSuper(){const p=G.p,B=G.B,s=B.sup;if(p.dead||p.sup<1)return;p.sup=0;sfx('super');
 if(s.kind==='ring'){for(let i=0;i<s.n;i++){const a=i*TAU/s.n;G.bul.push({x:p.x,y:p.y,vx:Math.cos(a)*s.spd,vy:Math.sin(a)*s.spd,r:12,dmg:s.dmg*p.dmgM,own:'p',d:0,range:s.range,col:'#ffb02e',kind:'thermo',sup:true});}}
 else if(s.kind==='rain'){p.hp=Math.min(p.max,p.hp+s.heal);G.zones.push({x:p.x,y:p.y,r:s.r,t:s.dur,dps:s.dps,follow:true});gTxt(p.x,p.y-40,'+'+s.heal,'#2fbf71');}
 else if(s.kind==='freeze'){for(const e of gEnemies()){if(gDist(p,e)<s.r+e.r){gHurt(e,s.dmg*p.dmgM,null,true);if(e.isBoss)e.frzT=Math.max(e.frzT||0,s.dur*0.5);else if(e!==G.safe)e.frzT=s.dur;}}for(let i=0;i<36;i++)gPart(p.x,p.y,'#c9f6ff',s.r*1.6);}
 gBanner(s.name+'!');}
function gHurt(e,dmg,b,quiet){if(e.hp<=0)return false;if(e.isBoss&&e.shield){if(!quiet)gTxt(e.x,e.y-e.r-10,'SCHILD','#8fe3ff');return false;}
 e.hp-=dmg;e.hurtT=0.1;if(b&&b.slow)e.slowT=b.slow;if(!quiet||dmg>=5){gTxt(e.x+(Math.random()-.5)*20,e.y-e.r-6,Math.round(dmg),'#fff');sfx('hit');}
 if(e.hp<=0){e.hp=0;if(e===G.safe||e.isBoss){for(let i=0;i<50;i++)gPart(e.x,e.y,'#ffd23c',320);G.shake=10;}else gKill(e);}return true;}
function gKill(e){G.kills++;for(let i=0;i<16;i++)gPart(e.x,e.y,e.type==='storm'?'#a7afc2':'#d9f3ff',200);
 if(Math.random()<0.25&&G.mode!=='a1')G.pick.push({kind:'heal',x:e.x,y:e.y,vx:0,vy:0,t:0});
 if(e.respawn)G.resp.push({t:G.mode==='a3'?5:4,type:e.type,home:e.home});}
function gHurtP(d){const p=G.p;if(p.dead||p.inv>0)return;p.hp-=d;p.lastDmg=G.t;p.hurtT=0.15;G.shake=Math.max(G.shake,5);sfx('ouch');
 if(p.hp<=0){p.hp=0;p.dead=true;p.respT=2.5;if(G.mode==='a2'||G.mode==='boss')p.lives--;for(let i=0;i<24;i++)gPart(p.x,p.y,G.B.col,240);
  if(G.mode==='a1'&&p.gems>0){for(let i=0;i<p.gems;i++){const a=Math.random()*TAU,s=120+Math.random()*120;G.pick.push({kind:'gem',x:p.x,y:p.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0});}gBanner('Kristalle verloren!');p.gems=0;}
  if(p.lives<=0){p.respT=1.2;}}}
function gCrate(w){G.A.walls=G.A.walls.filter(x=>x!==w);const c={x:w.x+w.w/2,y:w.y+w.h/2};for(let i=0;i<14;i++)gPart(c.x,c.y,'#b07a3c',200);G.pick.push({kind:w.crate,x:c.x,y:c.y,vx:0,vy:0,t:0});sfx('pop');}
function gPickup(k){const p=G.p;

function gPickClue(bank){let pool=CLUES[bank].slice();if(bank==='boss')pool=pool.concat(CLUES.c2,CLUES.c3);
 let cand=pool.filter(q=>!G.used[q.id]);if(!cand.length){G.used={};cand=pool;}
 const w=cand.map(q=>1+2*((S.g.clue[q.id]||{}).miss||0));let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<cand.length;i++){r-=w[i];if(r<=0)return cand[i];}return cand[cand.length-1];}
function gClueAsk(bank,title,cb){G.paused=true;gResetInput();const q=gPickClue(bank);G.used[q.id]=1;const ord=shuffle(q.o.map((t,i)=>i));
 const ov=document.getElementById('gOverlay');ov.hidden=false;
 ov.innerHTML=`<div class="clue burst"><div class="ct">🔎 ${esc(title)}</div><div class="q">${esc(q.q)}</div><div class="opts">${ord.map(i=>`<button class="opt" data-ci="${i}">${esc(q.o[i])}</button>`).join('')}</div><div id="clueFb"></div></div>`;
 let answered=false,okv=false;
 ov.onclick=e=>{const b=e.target.closest('[data-ci]');if(b&&!answered){answered=true;const i=+b.dataset.ci,ok=i===0;okv=ok;G.clue.asked++;const rec=S.g.clue[q.id]||(S.g.clue[q.id]={n:0,miss:0});rec.n++;
   if(ok){G.clue.right++;S.g.tro+=1;sfx('ok');}else{rec.miss++;G.clue.miss.push(q);sfx('bad');}
   logAns('G|'+q.id,ok,q.o[i],1,'game');
   ov.querySelectorAll('[data-ci]').forEach(x=>{const xi=+x.dataset.ci;x.classList.add(xi===0?'right':(xi===i?'wrong':'dim'));});
   document.getElementById('clueFb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b class="h">${ok?'Richtig! +1 🏆':'Nicht ganz.'}</b>${ok?'':'Richtig ist: <b>'+esc(q.o[0])+'</b>. '}${esc(q.ex||'')}</div><div class="actions"><button class="btn green" data-cgo="1">Weiter kämpfen ▶</button></div>`;save();return;}
  if(e.target.closest('[data-cgo]')){ov.hidden=true;ov.innerHTML='';ov.onclick=null;G.paused=false;G.last=performance.now();if(cb)cb(okv);}};}

   else if(t.ok)h+=`<div class="fb ok"><b class="h">Richtig! ${t.tro?'+'+t.tro+' 🏆':''}</b>${esc(task.ex||'')}${t.mode==='fk'&&!t.tro?'<div class="small mut" style="margin-top:6px">Beim 2. Versuch richtig – repariert ist die Aufgabe erst, wenn sie beim 1. Versuch klappt. Probier es später nochmal!</div>':''}${t.mode==='fk'&&t.tro?'<div class="small" style="margin-top:6px">🧰 Repariert!</div>':''}</div>`;
   else h+=`<div class="fb bad"><b class="h">Die Lösung:</b>${solHTML(task)}<div style="margin-top:6px">${esc(task.ex||'')}</div>${t.mode==='live'?'<div class="small mut" style="margin-top:6px">Diese Aufgabe kommt in die Fehler-Kiste 🧰 – dort übst du sie nochmal.</div>':''}</div>`;}
  else if(t.msg)h+=`<div class="fb hint"><b class="h">Noch ein Versuch! 💡</b>${esc(t.msg)}${task.hintFig?'<div class="figbox" style="margin-top:8px">'+fig(task.hintFig)+'</div>':''}</div>`;}
 h+='<div class="actions">'+ctx+'</div>';return h;}
function refresh(){const el=$('#tcard');if(!el)return render();el.innerHTML=tCard(TR.task,TR,actionsHTML());const ps=$('#plotSvg');if(ps)ps.addEventListener('pointerdown',plotTap);}
function actionsHTML(){const t=TR;if(t.mode==='exam')return `<button class="btn purple" data-a="exSave">Antwort speichern ›</button>`;
 if(t.review)return `<button class="btn ghost" data-a="practice">🔁 Nochmal üben</button><button class="btn blue" data-a="tNext">Weiter ›</button>`;
 if(t.done)return t.mode==='fk'?`<button class="btn blue" data-a="go" data-v="fk">Zur Fehler-Kiste ›</button>`:`<button class="btn blue" data-a="tNext">Weiter ›</button>`;
 return `<button class="btn green" data-a="check">Prüfen ✓</button>`;}
VIEWS.task=()=>{const st=STAGES.find(s=>s.k===R.k),list=TASKS[R.k],task=list[R.i],rec=S.st[R.k].tasks[task.id];if(!TR||TR.id!==task.id)TR=initTR(task,rec&&rec.done?'review':'live');
 return topbar('stage&k='+R.k,`Aufgabe ${R.i+1} von ${list.length}`,`Stufe ${st.n}: ${st.title}`)+`<div class="dots" style="margin-top:-4px">${list.map((x,i)=>{const r=S.st[R.k].tasks[x.id];const c=r&&r.done?(r.first?'ok':(r.ok?'ok2':'bad')):'';return `<button class="dot ${c} ${i===R.i?'cur':''}" data-a="task" data-k="${R.k}" data-i="${i}">${i+1}</button>`;}).join('')}</div><div class="card" id="tcard">${tCard(task,TR,actionsHTML())}</div>`;};
function doCheck(){const t=TR,task=t.task,r=checkTask(task,t);if(r.inc){toast(r.inc);refresh();return;}t.tries++;
 if(t.mode==='live'||t.mode==='fk'||t.mode==='practice')logAns(task.id,r.ok,r.given,t.tries,t.mode);
 if(r.ok){t.done=true;t.ok=true;sfx('ok');finish(true);}else if(t.tries>=2){t.done=true;t.ok=false;sfx('bad');finish(false);}else{t.msg=r.msg;sfx('bad');}save();refresh();}
function finish(ok){const t=TR,task=t.task;
 if(t.mode==='live'){const first=ok&&t.tries===1;S.st[R.k].tasks[task.id]={done:true,ok,first,tries:t.tries,at:Date.now()};t.tro=first?3:(ok?1:0);S.g.tro+=t.tro;if(!first)addFK(task.id);save();setTimeout(()=>checkStageDone(R.k),700);}
 else if(t.mode==='fk'){const f=S.fk[R.key];if(ok&&t.tries===1&&f){f.fixed=true;f.fixedAt=Date.now();t.tro=2;S.g.tro+=2;}else if(f){t.msg='';}}}
function nextTask(){const list=TASKS[R.k];if(R.i<list.length-1)go('task',{k:R.k,i:R.i+1});else go('stage',{k:R.k});}
function checkStageDone(k){const ss=S.st[k],inf=stInfo(k);if(!ss.done&&inf.ans===inf.total&&ss.nb!=='open'){ss.done=true;ss.doneAt=Date.now();S.g.tro+=10;const b=BRAWLERS[STAGES.find(s=>s.k===k).reward.brawler];if(!brawlerOpen(S.g.sel)||k==='s1')S.g.sel=Object.keys(BRAWLERS).find(x=>BRAWLERS[x]===b);save();showReward(k);}}
function showReward(k){const st=STAGES.find(s=>s.k===k),bk=st.reward.brawler,b=BRAWLERS[bk],ar=ARENAS[st.reward.arena];sfx('unlock');confetti();
 $('#modal').innerHTML=`<div class="mbg"><div class="modal reward burst"><div class="qnum">Stufe ${st.n} geschafft! +10 🏆</div><h2 class="f">NEUER BRAWLER: ${b.name.toUpperCase()}!</h2><canvas data-hero="${bk}" data-l="0"></canvas><p>${esc(b.desc)}</p>
 <div class="fb ok" style="text-align:left">🔓 Neue Arena: <b>${ar.name}</b> (${ar.modeName})${st.reward.exam?'<br>🔓 <b>Abschlussprüfung</b> freigeschaltet!':''}</div><div class="actions" style="justify-content:center"><button class="btn ghost" data-a="mClose">Später</button><button class="btn" data-a="mArena" data-k="${st.reward.arena}">⚔️ Jetzt kämpfen</button></div></div></div>`;
 document.querySelectorAll('#modal canvas[data-hero]').forEach(c=>drawHero(c,c.dataset.hero,false));}
function confetti(){const cols=['#ff7a45','#ffc93c','#3d9bff','#2fbf71','#ff4f9a','#7b4dff'];for(let i=0;i<46;i++){const d=document.createElement('div');d.className='conf';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.animationDuration=(1.6+Math.random()*1.6)+'s';d.style.animationDelay=(Math.random()*0.4)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3800);}}

 cur.i++;sfx('tap');if(cur.i>=EXAM.length){exFinish();return;}save();go('exam');}
function exFinish(){const cur=S.exam.cur;let sc=0;const pg={};EXAM.forEach(it=>{const a=cur.ans[it.id];pg[it.g]=pg[it.g]||[0,0];pg[it.g][1]++;if(a&&a.ok){sc++;pg[it.g][0]++;}});
 const pct=Math.round(sc/EXAM.length*100);const run={id:cur.id,t:cur.t,end:Date.now(),score:sc,max:EXAM.length,pct,pg,ans:cur.ans};S.exam.runs.push(run);S.exam.cur=null;S.exam.best=Math.max(S.exam.best,pct);
 const firstPass=pct>=60&&!S.exam.passed;if(pct>=60)S.exam.passed=true;S.exam.power=Math.max(S.exam.power,Math.min(4,Math.floor(pct/25)));S.g.tro+=sc;save();if(pct>=60){sfx('unlock');confetti();}else sfx('ok');go('exRes',{i:S.exam.runs.length-1,fp:firstPass});}

 L.push('Learning time: '+Math.round(S.learnSec/60)+' min · Game time: '+Math.round(S.g.sec/60)+' min · Trophies: '+S.g.tro);L.push('');
 STAGES.forEach(st=>{const i=stInfo(st.k),ss=S.st[st.k];L.push(`Stage ${st.n} ${st.title}: ${i.ans}/${i.total} answered, ${i.first} right first try (${pctFirst(st.k)}% of answered), cards read ${Math.min(ss.seen,CARDS[st.k].length)}/${CARDS[st.k].length}, notebook: ${ss.nb}${ss.done?', DONE '+dateEN(ss.doneAt):''}`);});
 L.push('');L.push('Final exam: '+(S.exam.runs.length?S.exam.runs.map(r=>`${r.id} ${dateEN(r.end)}: ${r.score}/${r.max} (${r.pct}%) – `+Object.keys(GOALS).map(g=>`${g} ${(r.pg[g]||[0,0]).join('/')}`).join(', ')).join(' | '):'not taken yet')+(S.exam.cur?' (a run is in progress)':''));
 L.push('Games: wins Steppe '+(S.g.wins.a1||0)+', Taiga '+(S.g.wins.a2||0)+', Lab '+(S.g.wins.a3||0)+', Boss '+(S.g.wins.boss||0)+' · plays '+S.g.plays);
 const cl=Object.entries(S.g.clue);const n=cl.reduce((a,[,v])=>a+v.n,0),m=cl.reduce((a,[,v])=>a+v.miss,0);L.push('Game clue questions: '+(n-m)+'/'+n+' right');
 const top=cl.filter(([,v])=>v.miss).sort((a,b)=>b[1].miss-a[1].miss).slice(0,6).map(([id,v])=>{const q=Object.values(CLUES).flat().find(x=>x.id===id);return q?`"${q.q}" (${v.miss}× wrong; answer: ${q.o[0]})`:id;});if(top.length)L.push('Most-missed clues: '+top.join('; '));
 L.push('');const open=fkOpen();L.push('Open mistakes (Fehler-Kiste): '+open.length);open.forEach(f=>{const t=fkTask(f.key);if(t)L.push(' - '+f.key+': '+(t.q||'gap text').slice(0,80)+' | last answer: '+(lastWrong(f.key.startsWith('X|')?f.key.split('|')[2]:f.key)||'–'));});
 return L.join('\n');}
